name: crm-starterkit

x-backend-env: &backend-env
  APP_NAME: CRM-StarterKit
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: http://localhost
  APP_PORT: "8080"
  JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret}
  JWT_ACCESS_TTL: 15m
  JWT_REFRESH_TTL: 168h
  JWT_ISSUER: crm-starterkit
  CORS_ALLOW_ORIGINS: "*"
  CACHE_DRIVER: ${CACHE_DRIVER:-redis}
  CACHE_PREFIX: crm:
  CACHE_DEFAULT_TTL: 1h
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_DB: "0"
  MEMCACHED_HOST: memcached:11211
  QUEUE_REDIS_ADDR: redis:6379
  QUEUE_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  QUEUE_REDIS_DB: "1"
  WORKER_CONCURRENCY: "10"
  STORAGE_DRIVER: local
  STORAGE_LOCAL_PATH: /app/storage/uploads
  STORAGE_PUBLIC_BASE_URL: http://localhost/uploads
  MIGRATIONS_PATH: /app/migrations
  PAYMENT_CALLBACK_BASE_URL: http://localhost/api/v1/payments/callback
  ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
  ZARINPAL_SANDBOX: "true"
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_CURRENCY: usd
  SMS_PROVIDER: kavenegar
  KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
  KAVENEGAR_SENDER: ${KAVENEGAR_SENDER:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: "587"
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  DB_DRIVER: ${DB_DRIVER:-postgres}
  DB_HOST: ${DB_HOST:-postgres}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME:-starterkit}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-secret}
  DB_SSLMODE: disable
  DB_TIMEZONE: UTC
  DB_SQLITE_PATH: /app/storage/database.sqlite
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_MAX: "100"
  RATE_LIMIT_WINDOW: 1m
  LOG_LEVEL: info
  LOG_ENCODING: json

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      <<: *backend-env
    volumes:
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      mysql:
        condition: service_healthy
        required: false
      sqlserver:
        condition: service_started
        required: false
      redis:
        condition: service_started
    networks:
      - app
    restart: unless-stopped

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile.worker
    environment:
      <<: *backend-env
    volumes:
      - backend_storage:/app/storage
    depends_on:
      - api
      - redis
    networks:
      - app
    restart: unless-stopped

  admin-panel:
    build:
      context: ../admin-panel
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost/api/v1
        NEXT_PUBLIC_WS_URL: ws://localhost/api/v1
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost/api/v1
    networks:
      - app
    restart: unless-stopped

  storefront:
    build:
      context: ../storefront
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost/api/v1
        NEXT_PUBLIC_SITE_URL: http://localhost
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost
    networks:
      - app
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/admin.conf:/etc/nginx/conf.d/admin.conf:ro
      - ./nginx/storefront.conf:/etc/nginx/conf.d/storefront.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_storage:/var/www/uploads:ro
    depends_on:
      - api
      - admin-panel
      - storefront
    networks:
      - app
    restart: unless-stopped

  postgres:
    profiles: [postgres]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-starterkit}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-starterkit}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

  mysql:
    profiles: [mysql]
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-starterkit}
      MYSQL_USER: ${DB_USER:-starterkit}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

  sqlserver:
    profiles: [sqlserver]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-Secret123!}
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${DB_PASSWORD:-Secret123!}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - app

  memcached:
    profiles: [memcached]
    image: memcached:1.6-alpine
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  postgres_data:
  mysql_data:
  sqlserver_data:
  redis_data:
  backend_storage:
